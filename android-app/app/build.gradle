plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lightjalao.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.lightjalao.game"
        minSdk 24
        targetSdk 35
        versionCode 16
        versionName "1.7.0"
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'lightjalao-test'
            keyAlias 'lightjalao'
            keyPassword 'lightjalao-test'
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    sourceSets {
        main {
            res.srcDir file("$buildDir/generated/res/branding")
        }
    }
}

def brandingOutputDir = file("$buildDir/generated/res/branding")

tasks.register("generateBrandingAssets") {
    def brandingParts = fileTree(file("../branding")) {
        include "logo.b64.part*"
    }.files.sort { a, b -> a.name <=> b.name }

    inputs.files(brandingParts)

    def logoOutput = file("$brandingOutputDir/drawable-nodpi/light_jalao_logo.webp")
    outputs.file(logoOutput)

    doLast {
        if (brandingParts.isEmpty()) {
            throw new GradleException("Light Jalao branding data is missing")
        }

        logoOutput.parentFile.mkdirs()
        def encodedLogo = brandingParts.collect { it.getText("UTF-8").trim() }.join("")
        logoOutput.bytes = java.util.Base64.getDecoder().decode(encodedLogo)
    }
}

tasks.named("preBuild").configure {
    dependsOn("generateBrandingAssets")
}


dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}

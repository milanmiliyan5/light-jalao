name: Build Light Jalao APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - "index.html"
      - "style.css"
      - "script.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: light-jalao-android-apk
  cancel-in-progress: true

# Bundles the latest current game files into the APK
jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cache stable test signing key
        uses: actions/cache@v4
        with:
          path: android-app/debug.keystore
          key: light-jalao-debug-keystore-v1

      - name: Create test signing key if missing
        run: |
          if [ ! -f android-app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android-app/debug.keystore \
              -storepass lightjalao-test \
              -alias lightjalao \
              -keypass lightjalao-test \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Light Jalao Test, OU=Development, O=Light Jalao, L=Berhampur, ST=Odisha, C=IN"
          fi

      - name: Bundle current game into Android assets
        run: |
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets/www/icons
          cp index.html android-app/app/src/main/assets/www/index.html
          cp style.css android-app/app/src/main/assets/www/style.css
          cp script.js android-app/app/src/main/assets/www/script.js
          cp manifest.webmanifest android-app/app/src/main/assets/www/manifest.webmanifest
          cp sw.js android-app/app/src/main/assets/www/sw.js
          cp icons/*.svg android-app/app/src/main/assets/www/icons/
          sed -E -i 's/(style\.css|script\.js)\?v=[^"]+/\1/g' android-app/app/src/main/assets/www/index.html

      - name: Build installable debug APK
        run: gradle --no-daemon -p android-app :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release/Light-Jalao.apk
          ls -lh release/Light-Jalao.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Light-Jalao-APK
          path: release/Light-Jalao.apk
          if-no-files-found: error

      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/Light-Jalao.apk \
            --title "Light Jalao APK Build ${GITHUB_RUN_NUMBER}" \
            --notes "Installable Android test APK for Light Jalao. Package: com.lightjalao.game. This is a debug-signed testing build; a Play Store AAB will use a separate release signing setup." \
            --prerelease

name: Build Light Jalao APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - "index.html"
      - "style.css"
      - "script.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle current web game into APK
        run: |
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets/www/icons
          cp index.html android-app/app/src/main/assets/www/index.html
          cp style.css android-app/app/src/main/assets/www/style.css
          cp script.js android-app/app/src/main/assets/www/script.js
          cp manifest.webmanifest android-app/app/src/main/assets/www/manifest.webmanifest
          cp sw.js android-app/app/src/main/assets/www/sw.js
          cp icons/*.svg android-app/app/src/main/assets/www/icons/

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk LightJalao-v1-debug.apk
          sha256sum LightJalao-v1-debug.apk > LightJalao-v1-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightJalao-APK
          path: |
            LightJalao-v1-debug.apk
            LightJalao-v1-debug.apk.sha256
          if-no-files-found: error

      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete light-jalao-apk-v1 --yes --cleanup-tag || true
          gh release create light-jalao-apk-v1             LightJalao-v1-debug.apk             LightJalao-v1-debug.apk.sha256             --title "Light Jalao Android APK v1"             --notes "Testing APK for Light Jalao. Package: com.lightjalao.game. This is a debug-signed build for direct installation/testing."
